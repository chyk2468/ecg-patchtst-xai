<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">ECG PatchTST + XAI Data Flow</title>
  <desc id="svg-desc">Ingress, Transformation, and Egress</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1214"/>
      <stop offset="100%" stop-color="#122024"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122024"/>
      <stop offset="100%" stop-color="#0A1214"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14B8A6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1D353C" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#14B8A6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ECG PATCHTST + XAI DATA FLOW</text>
  <text x="48" y="70" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Ingress, Transformation, and Egress</text>
  <g filter="url(#glow)">
    <rect x="48" y="100" width="260" height="204" rx="12" fill="#122024" stroke="#1D353C" stroke-width="1.2"/>
    <rect x="48" y="100" width="260" height="5" rx="2.5" fill="#14B8A6"/>
    <text x="64" y="132" fill="#14B8A6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">01 / INGEST</text>
    <text x="64" y="160" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Raw Signal</text>
    <text x="64" y="188" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">WFDB MIT-BIH 12-lead</text>
    <text x="64" y="206" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">digital records</text>
  </g>
  <path d="M 311 202.0 L 323 202.0" stroke="#99F6E4" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 319 198.0 L 324 202.0 L 319 206.0" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="328" y="100" width="260" height="204" rx="12" fill="#122024" stroke="#1D353C" stroke-width="1.2"/>
    <rect x="328" y="100" width="260" height="5" rx="2.5" fill="#2DD4BF"/>
    <text x="344" y="132" fill="#2DD4BF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 / PATCH</text>
    <text x="344" y="160" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Tokenization</text>
    <text x="344" y="188" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Signal unfolding into</text>
    <text x="344" y="206" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">non-overlapping</text>
    <text x="344" y="224" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">patches</text>
  </g>
  <path d="M 591 202.0 L 603 202.0" stroke="#99F6E4" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 599 198.0 L 604 202.0 L 599 206.0" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="608" y="100" width="260" height="204" rx="12" fill="#122024" stroke="#1D353C" stroke-width="1.2"/>
    <rect x="608" y="100" width="260" height="5" rx="2.5" fill="#14B8A6"/>
    <text x="624" y="132" fill="#14B8A6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">03 / INFER</text>
    <text x="624" y="160" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">PatchTST</text>
    <text x="624" y="188" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Transformer</text>
    <text x="624" y="206" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">cross-channel</text>
    <text x="624" y="224" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">attention pass</text>
  </g>
  <path d="M 871 202.0 L 883 202.0" stroke="#99F6E4" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 879 198.0 L 884 202.0 L 879 206.0" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="888" y="100" width="260" height="204" rx="12" fill="#122024" stroke="#1D353C" stroke-width="1.2"/>
    <rect x="888" y="100" width="260" height="5" rx="2.5" fill="#2DD4BF"/>
    <text x="904" y="132" fill="#2DD4BF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">04 / EXPLAIN</text>
    <text x="904" y="160" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">XAI Overlay</text>
    <text x="904" y="188" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">SHAP attribution &amp;</text>
    <text x="904" y="206" fill="#99F6E4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Grad-CAM heatmap</text>
  </g>
</svg>

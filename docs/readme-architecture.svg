<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">ECG PatchTST + XAI workflow</title><desc id="desc">The research pipeline preprocesses ECG signals, trains/evaluates a PatchTST classifier, then generates explanation outputs for analysis and the Streamlit app.</desc><rect width="1200" height="400" rx="18" fill="#EFF5F7"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#247A91">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#233746">ECG PatchTST + XAI</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#647986">12-lead signals to predictions and explanations</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D4E1E7"/><path d="M 300 237 L 330 237" stroke="#647986" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#647986" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#647986" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#647986" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#647986" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#647986" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D4E1E7" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#247A91"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#247A91">01 / ECG DATA</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#233746">PTB-XL records</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#647986">Load 12-lead signals and labels.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D4E1E7" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#4D8A78"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4D8A78">02 / PREPROCESS</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#233746">Split and normalise</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#647986">Prepare model-ready time series.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D4E1E7" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#C18B55"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#C18B55">03 / PATCHTST</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#233746">Multi-label prediction</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#647986">Train or load the classifier.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D4E1E7" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#247A91"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#247A91">04 / EXPLAIN</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#233746">XAI + dashboard</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#647986">Inspect attention and attribution maps.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#247A91">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#647986">This is a research aid, not a standalone diagnostic tool.</text></svg>